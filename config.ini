[DEFAULT]
split_command = ffmpeg -y -i {input_directory}/input.mkv -c copy -map 0 -f segment -segment_times {segment_times} -segment_start_number 1 -reset_timestamps 1 {input_directory}/part%d.mkv
execute_command = ffmpeg -i {input} -c:v libx265 -crf 28 {output_directory}/{output}
merge_command = ffmpeg -f concat -safe 0 -i filelist.txt -c copy {output_directory}/output.mkv
max_nodes = 2

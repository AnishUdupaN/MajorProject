
[DEFAULT]
split_command = ffmpeg -y -i {input_directory}/input.mkv -c copy -map 0 -f segment -segment_times {segment_times} -segment_start_number 1 -reset_timestamps 1 {input_directory}/part%d.mkv
execute_command = ffmpeg -y -i {input} -c:v libx264 -preset ultrafast -threads 0 {output_directory}/{output}
merge_command = ffmpeg -y -f concat -safe 0 -i filelist.txt -c copy {output_directory}/output.mkv
max_nodes = 2
min_devices = 1
on_high_usage = throttle
long_runnable = false
cpu_threshold_percent = 99.0
cpu_threshold_seconds = 20.0
nice_initial = 5
nice_step = 5
nice_max = 19
nice_check_interval_seconds = 60.0
max_throttle_duration_seconds = 600.0
unthrottle_threshold_seconds = 20.0





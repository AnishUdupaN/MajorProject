[DEFAULT]
split_command = ffmpeg -y -ss 00:00:00 -i {input_directory}/input.mkv -to 00:20:00 -c copy -map 0 -f segment -segment_times {segment_times} -segment_start_number 1 -reset_timestamps 1 {input_directory}/part%d.mkv
execute_command = ffmpeg -y -i {input} -vf "format=gray,subtitles='{input}':si=0,drawtext=fontcolor=yellow:fontsize=36:x=40:y=40:timecode='00\:00\:00\:00':rate=24000/1001:box=1:boxcolor=black@0.6" -c:v libx264 -preset fast -crf 20 -c:a aac -b:a 192k -map_metadata -1 {output_directory}/{output}
merge_command = ffmpeg -y -f concat -safe 0 -i filelist.txt -c copy {output_directory}/output.mkv
max_nodes = 4
min_devices = 2
on_high_usage = throttle
long_runnable = false
cpu_threshold_percent = 70.0
cpu_threshold_seconds = 10.0
nice_initial = 5
nice_step = 5
nice_max = 19
nice_check_interval_seconds = 5.0
max_throttle_duration_seconds = 600.0
unthrottle_threshold_seconds = 20.0

# Binary distribution settings
binary_name = ffmpeg
binaries_directory = binaries
require_binary = true
resource_type = multi_core
min_vram_mb = 0
execute_command_macos = ffmpeg -y -i {input} -c:v h264_videotoolbox -q:v 65 {output_directory}/{output}

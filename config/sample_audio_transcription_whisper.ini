[DEFAULT]
split_command = ffmpeg -y -i {input_directory}/input.mp3 -f segment -segment_times {segment_times} -segment_start_number 1 {input_directory}/part%d.mp3
merge_command = python3 -c "import glob, os; out = open('{output_directory}/output.txt', 'w'); [out.write(open(f).read() + '\n') for f in sorted(glob.glob('{output_directory}/part*.txt'))]; out.close()"
max_nodes = 4
min_nodes = 1
on_high_usage = throttle
long_runnable = true
cpu_threshold_percent = 75.0
cpu_threshold_seconds = 10.0
resource_type = gpu
min_vram_mb = 0
binary_name = transcribe_helper
require_binary = true
execute_command = transcribe_helper.py {input} {output_directory}/{output}

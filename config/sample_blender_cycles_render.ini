[DEFAULT]
split_command = python3 -c "import shutil; [shutil.copy('{input_directory}/scene.blend', '{input_directory}/part%d.blend' % i) for i in range(1, 5)]"
merge_command = ffmpeg -y -framerate 30 -i {output_directory}/frame_%%04d.png -c:v libx264 -pix_fmt yuv420p {output_directory}/output.mp4
max_nodes = 4
min_nodes = 1
on_high_usage = throttle
long_runnable = true
cpu_threshold_percent = 75.0
cpu_threshold_seconds = 10.0
resource_type = gpu
min_vram_mb = 2048
binary_name = blender
require_binary = false
execute_command = blender -b {input} -o {output_directory}/frame_#### -E CYCLES -F PNG -a

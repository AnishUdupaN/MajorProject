[DEFAULT]
split_command = ffmpeg -y -ss 00:00:00 -i {input_directory}/input.mkv -to 00:20:00 -c copy -map 0 -f segment -segment_times {segment_times} -segment_start_number 1 -reset_timestamps 1 {input_directory}/part%d.mkv
merge_command = ffmpeg -y -f concat -safe 0 -i filelist.txt -c copy {output_directory}/output.mkv
max_nodes = 4
min_nodes = 2
on_high_usage = throttle
long_runnable = false
cpu_threshold_percent = 70.0
cpu_threshold_seconds = 10.0
binary_name = ffmpeg
require_binary = true
resource_type = multi_core
min_vram_mb = 0
execute_command = ffmpeg -y -i {input} -vf "negate" -c:v libx264 -preset fast -crf 28 -c:a copy {output_directory}/{output}

[DEFAULT]
split_command = split -n 4 -d {input_directory}/input.bin {input_directory}/part
merge_command = cat {output_directory}/part*.zst > {output_directory}/output.bin.zst
max_nodes = 4
min_nodes = 1
on_high_usage = throttle
long_runnable = false
cpu_threshold_percent = 70.0
cpu_threshold_seconds = 10.0
resource_type = multi_core
min_vram_mb = 0
execute_command = zstd -19 -T0 {input} -o {output_directory}/{output}.zst

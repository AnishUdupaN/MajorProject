[DEFAULT]
split_command = python3 -c "import shutil, os; [shutil.copy('{input_directory}/archive.tar', '{input_directory}/part%d.tar' % i) for i in range(1, 5)]"
merge_command = python3 -c "import shutil, glob; print('Finished processing all image parts in {output_directory}')"
max_nodes = 4
min_nodes = 1
on_high_usage = throttle
long_runnable = false
cpu_threshold_percent = 70.0
cpu_threshold_seconds = 10.0
resource_type = multi_core
min_vram_mb = 0
execute_command = bash -c "mkdir -p tmp_img && tar -xf {input} -C tmp_img && mogrify -resize 1920x1080 -quality 85 tmp_img/*.jpg && tar -cf {output_directory}/{output} -C tmp_img ."
